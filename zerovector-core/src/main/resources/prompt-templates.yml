version: "1.0"
defaultVersion: "1.0"

templates:
  generateSummary:
    versions:
      - version: "1.0"
        template: |
          请为以下文档生成一个简洁的摘要(不超过50字):
          标题：%s
          内容：%s
        parameters:
          - name: "title"
            type: "String"
            description: "文档标题"
          - name: "content"
            type: "String"
            description: "文档内容"

  clusterDocumentChunks:
    versions:
      - version: "1.0"
        template: |
          请将以下文档块按内容主题相似性聚类为3-5个类别。
          重要：只有内容真正相关的文档才能放在同一类别中。
          如果文档内容完全不相关，请将它们分到不同的类别，即使某些类别可能只有一个文档。
          %s
          请按以下JSON格式返回结果:
          {
            "clusters": [
              {
                "name": "类别名称",
                "chunkIndices": [0, 1, 2]
              }
            ]
          }
        parameters:
          - name: "chunks"
            type: "List<String>"
            description: "文档块列表"

  decideNavigation:
    versions:
      - version: "1.0"
        template: |
          用户查询：%s
          当前节点：%s - %s
          可选子节点：
          %s
          请分析用户查询，选择最相关的子节点。
          返回JSON格式: {"selectedIndex": 0, "reasoning": "选择原因", "confidence": 0.8}
          如果没有相关子节点，请返回{"selectedIndex": -1, "reasoning": "没有相关子节点", "confidence": 0.0}
        parameters:
          - name: "query"
            type: "String"
            description: "用户查询"
          - name: "currentNodeName"
            type: "String"
            description: "当前节点名称"
          - name: "currentNodeDescription"
            type: "String"
            description: "当前节点描述"
          - name: "childNodes"
            type: "List<String>"
            description: "可选子节点列表"

  extractEntities:
    versions:
      - version: "1.0"
        template: |
          请从以下内容中提取5个重要的实体(如人名、地名、组织名、产品名等):
          %s
          请只列出实体，每行一个：
        parameters:
          - name: "content"
            type: "String"
            description: "内容文本"

  extractKeywords:
    versions:
      - version: "1.0"
        template: |
          请从以下内容中提取5个关键词:
          %s
          请只列出关键词，每行一个：
        parameters:
          - name: "content"
            type: "String"
            description: "内容文本"

  generateExampleQuestions:
    versions:
      - version: "1.0"
        template: |
          请为以下内容生成3个示例问题:
          %s
          请生成3个简洁的问题,每行一个:
        parameters:
          - name: "content"
            type: "String"
            description: "内容文本"

  comprehendChunk:
    versions:
      - version: "1.0"
        template: |
          请分析以下文档内容（第%s部分，共%s部分）：

          %s

          请提取：
          1. 这部分的摘要（不超过100字）
          2. 这部分的关键词及其定义（5-10个），每个关键词需要包含：
             - keyword: 关键词
             - definition: 关键词的定义
             - context: 关键词出现的上下文（不超过50字）
          3. 这部分的实体（5-10个）
          4. 这部分的示例问题（1-3个）

          按以下JSON格式返回：
          {
            "summary": "摘要",
            "keywordDefinitions": [
              {
                "keyword": "关键词1",
                "definition": "定义1",
                "context": "上下文1"
              },
              {
                "keyword": "关键词2",
                "definition": "定义2",
                "context": "上下文2"
              }
            ],
            "entities": ["实体1", "实体2"],
            "exampleQuestions": ["问题1", "问题2"]
          }
        parameters:
          - name: "chunkIndex"
            type: "int"
            description: "当前块索引"
          - name: "totalChunks"
            type: "int"
            description: "总块数"
          - name: "context"
            type: "String"
            description: "上下文信息"
