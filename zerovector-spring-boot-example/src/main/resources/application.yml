server:
  port: 8080

spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${AI_OPENAI_API_KEY:your-api-key}
      base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        completions-path: /chat/completions

# ZeroVector配置
zerovector:
  enabled: true
  use-sharded-storage: true
  shard-size: 100
  model:
    heavy: gpt-4o-mini
    light: gpt-4o-mini
    fast: gpt-4o-mini
  concurrency:
    max-concurrent-requests: 1
    requests-per-second: 1
  rate-limit:
    enabled: true
    max-requests: 5
    window-seconds: 60
  hook:
    enabled: true
    hooks:
      - cn.nexon.zerovector.core.hook.LoggingLifecycleHook

# 日志配置
logging:
  level:
    cn.nexon.zerovector: INFO