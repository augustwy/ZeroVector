spring:
  ai:
    model:
      chat: openai
    openai:
      api-key: ${AI_OPENAI_API_KEY}
      base-url: https://api.hunyuan.cloud.tencent.com/v1
      chat:
        completions-path: /chat/completions

# ZeroVector配置
zerovector:
  enabled: true
  storage-path: ./data/zerovector_storage
  use-sharded-storage: true
  shard-size: 100
  model:
    clustering: hunyuan-turbos-latest
    navigation: hunyuan-turbos-latest
  concurrency:
    max-concurrent-requests: 1
    requests-per-second: 1
  hook:
    enabled: true
    hooks:
      - cn.nexon.zerovector.core.hook.LoggingLifecycleHook

# 日志配置
logging:
  level:
    cn.nexon.zerovector: INFO